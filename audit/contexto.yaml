# Perguntas de contexto — Módulo de Entrada e Contextualização (TCC1 §3.5, camada 1).
# Cobre RF01 (porte pela receita), RF02 (calibração financeira), RF05 (mapeamento de ativos) e RF03 (apetite e
# tolerância). Revisão da Etapa 1: C-ROB, C-HORA, C-DADO, C-APET, C-FAIXA, S3 e S4.

financeiro:            # RF01 + RF02
  - id: receita_operacional_bruta
    texto: "Qual foi a receita bruta da empresa nos últimos 12 meses?"
    ajuda: "É tudo o que a empresa recebeu com vendas e serviços no período, antes de descontar impostos, custos e despesas. É o mesmo valor usado no Simples Nacional. Com ele, a ferramenta identifica o porte da empresa e estima o tamanho dos prejuízos. Um valor aproximado basta, e ele não é guardado nem enviado a ninguém."
    como_calcular: "Some o valor das notas fiscais de venda e de serviço dos últimos 12 meses e desconte as vendas canceladas e os descontos dados na própria nota. Se a empresa tem menos de 12 meses, divida o total pelo número de meses de atividade e multiplique por 12."
    onde_encontrar: "Na declaração do Simples Nacional (PGDAS-D) ou, no caso do MEI, na declaração anual (DASN-SIMEI); no relatório de faturamento do sistema de notas fiscais; ou com o seu contador."
    mensagem_porte: "Pela receita informada, sua empresa está na faixa de {porte}. Essa classificação serve só para ajustar a análise e não muda o enquadramento da empresa nos impostos."
    tipo: moeda
    obrigatorio: true      # sem valor padrão por porte (S3); sem opção por faixa (C-ROB)
    fonte: lc123           # art. 3º, §§ 1º e 2º; classificação em portes.yaml (ADR-010)
  - id: custo_hora_parada
    texto: "Se os sistemas da empresa (vendas, atendimento, produção) parassem por 1 hora em horário comercial, quanto vocês deixariam de ganhar ou gastariam a mais?"
    ajuda: "Pense em vendas perdidas, equipe parada e horas extras para recuperar o atraso. Um valor aproximado já ajuda."
    tipo: moeda
    padrao: formula
    formula: "receita_operacional_bruta / 2080"   # 2.080 horas úteis/ano (52 semanas × 40 h): premissa declarada
    mensagem_padrao: "Se não souber, usamos R$ {valor}, que é a sua receita dividida pelas horas úteis do ano."

ativos:                # RF05
  - id: ativo_critico
    texto: "Qual destas coisas, se parasse ou vazasse, mais prejudicaria a empresa?"
    ajuda: "É o seu ativo mais crítico: aquilo sem o qual a empresa para ou perde a confiança dos clientes. Os cenários ligados a ele ganham destaque no relatório."
    tipo: escolha
    opcoes:
      - { id: vendas,     rotulo: "Sistema de vendas, loja virtual ou caixa",             destaca: [IND, RAN] }
      - { id: clientes,   rotulo: "Cadastro de clientes ou pacientes",                    destaca: [VAZ, TER] }
      - { id: producao,   rotulo: "Máquinas, produção ou operação",                       destaca: [RAN, IND] }
      - { id: financeiro, rotulo: "Contas bancárias e pagamentos",                        destaca: [FRA] }
      - { id: projetos,   rotulo: "Projetos, contratos, código-fonte ou segredos comerciais", destaca: [VAZ, IA, TER] }
  - id: tipo_dado
    texto: "Que tipo de informação sobre pessoas (clientes, pacientes, funcionários) a empresa guarda?"
    ajuda: "Pela LGPD, alguns dados exigem mais cuidado, e saúde e biometria são dados sensíveis. Escolha o tipo mais delicado que vocês guardam: ele indica quais recomendações de privacidade são mais importantes para a sua empresa."
    tipo: escolha
    # Não multiplica o prejuízo (revisão C-DADO): vira um selo nas recomendações dos controles abaixo.
    selo_em_controles: ["5.34", "8.10", "8.12"]
    # Revisão M3: ID-02 (saber onde ficam os dados) e SER-01 também levam o selo, para que o MEI fora da saúde o veja.
    selo_em_perguntas: [SAU-01, ID-02, SER-01]
    opcoes:
      - { id: minimo,     rotulo: "Quase nada: só nome e telefone de alguns contatos" }
      - { id: cadastral,  rotulo: "Dados cadastrais (nome, CPF, endereço, e-mail)",
          selo: "Relevante para a sua empresa: vocês guardam dados pessoais, como CPF e endereço, que são protegidos pela LGPD." }
      - { id: financeiro, rotulo: "Dados financeiros ou de cartão de pagamento",
          selo: "Relevante para a sua empresa: vocês guardam dados financeiros ou de cartão, que atraem golpistas e exigem cuidado extra." }
      - { id: sensivel,   rotulo: "Dados de saúde, biometria ou outros dados sensíveis (LGPD art. 11)",
          selo: "Prioridade para a sua empresa: vocês guardam dados pessoais sensíveis, como saúde ou biometria. Pela LGPD, o vazamento desses dados é mais grave e pode fazer a empresa perder as regras simplificadas para pequenos negócios." }
    fonte: lgpd
  - id: registros_pessoais
    texto: "Aproximadamente de quantas pessoas a empresa guarda dados?"
    ajuda: "Conte clientes (atuais e antigos), pacientes, funcionários e ex-funcionários. Uma ordem de grandeza já basta: o custo de um vazamento cresce com o número de pessoas atingidas."
    tipo: faixa
    opcoes:
      - { id: ate100,   rotulo: "Até 100",               valor: 50 }
      - { id: ate1k,    rotulo: "Entre 100 e 1.000",     valor: 500 }
      - { id: ate10k,   rotulo: "Entre 1.000 e 10.000",  valor: 5000 }
      - { id: ate100k,  rotulo: "Entre 10.000 e 100.000", valor: 50000 }
      - { id: mais100k, rotulo: "Mais de 100.000",       valor: 200000 }
    obrigatorio: true      # sem valor padrão por porte (revisão S3, 12/10/2026)
    # `valor` = número usado na simulação para cada faixa. ESCOLHA DE MODELAGEM declarada (inventário J7):
    # valor arredondado próximo ao ponto médio da faixa; na última faixa (aberta), o dobro do limite inferior.
    fonte: julgamento
  - id: usuarios_ti
    texto: "Quantas pessoas usam computador, celular ou e-mail da empresa para trabalhar?"
    ajuda: "Conte todos que têm login em algum sistema ou e-mail da empresa: sócios, funcionários, estagiários e terceiros fixos. Essa quantidade define quantas licenças de proteção a empresa precisaria comprar, o que entra no custo de cada recomendação."
    tipo: inteiro
    minimo: 1
    obrigatorio: true      # revisão S4: substitui custos.parametros.usuarios por porte
    # Uso: licenças por usuário/mês e volume de backup (usuarios_ti × gb_por_usuario, audit/custos.yaml); também
    # ativa as variantes de pergunta para quem trabalha sozinho (usuarios_max: 1). Fora das faixas de pessoas do
    # porte (portes.yaml): aviso na tela, sem bloquear.

calibracao_risco:      # RF03 — Módulo de Calibração (sem pré-seleção: revisão C-APET)
  - id: apetite_pct
    texto: "Pensando num ano ruim: até quanto a empresa conseguiria perder com problemas digitais sem precisar mudar seus planos (atrasar contas, cortar investimentos)?"
    ajuda: "Esse é o seu apetite ao risco: perdas até esse valor são desconfortáveis, mas aceitáveis."
    tipo: escolha
    opcoes:
      - { id: a05, rotulo: "Até 0,5% do faturamento", valor: 0.005 }
      - { id: a1,  rotulo: "Até 1% do faturamento",   valor: 0.01 }
      - { id: a2,  rotulo: "Até 2% do faturamento",   valor: 0.02 }
      - { id: a5,  rotulo: "Até 5% do faturamento",   valor: 0.05 }
      - { id: a10, rotulo: "Até 10% do faturamento",  valor: 0.10 }
      - { id: nao_sei, rotulo: "Não sei dizer", valor: 0.01 }   # materialidade de 1% da receita (isa320)
    obrigatorio: true
  - id: tolerancia_pct
    texto: "E a partir de qual perda a continuidade da empresa ficaria ameaçada?"
    ajuda: "Essa é a sua tolerância: acima dela, o risco é inaceitável e exige ação imediata."
    tipo: escolha
    opcoes:
      - { id: t5,  rotulo: "5% do faturamento",  valor: 0.05 }
      - { id: t10, rotulo: "10% do faturamento", valor: 0.10 }
      - { id: t20, rotulo: "20% do faturamento", valor: 0.20 }
      - { id: t30, rotulo: "30% do faturamento", valor: 0.30 }
      - { id: t50, rotulo: "50% do faturamento", valor: 0.50 }
      - { id: nao_sei, rotulo: "Não sei dizer", valor_por_setor: true }
    obrigatorio: true
    restricao: "tolerancia_pct > apetite_pct"   # a tela impede combinações inválidas
    # "Não sei dizer" = margem de lucro antes do IR de empresas com 20+ pessoas (perder mais que o lucro de um ano
    # ameaça a continuidade). IBGE 2023; saúde sem dado público => menor valor entre os setores (cautela).
    nao_sei_por_setor:
      varejo:     { valor: 0.045, fonte: ibge-pac, calculo: "PAC 2023, varejo 20+: resultado antes do IR / receita" }
      servicos:   { valor: 0.286, fonte: ibge-pas, calculo: "PAS 2023, serviços técnico-profissionais 20+" }
      tecnologia: { valor: 0.098, fonte: ibge-pas, calculo: "PAS 2023, serviços de TI 20+" }
      industria:  { valor: 0.100, fonte: ibge-pia, calculo: "PIA 2023, 30 a 49 pessoas: (144.130.309 − 129.713.462) / 144.130.309" }
      saude:      { valor: 0.045, fonte: ibge-pac, calculo: "sem dado público do setor: menor valor entre os setores" }

# Avaliação de riscos (ISO/IEC 27005, critérios de aceitação) — matriz 3 × 3 (revisão C-FAIXA e G4).
# Impacto = P90 da perda anual NOS ANOS EM QUE O CENÁRIO ACONTECE (evita que um cenário raro some com P90 = 0),
# comparado com apetite e tolerância em R$ (percentual × receita). Probabilidade = P(≥ 1 evento de perda no ano).
# Escalas de probabilidade: convenção declarada (a 27005 deixa as escalas à organização).
matriz:
  impacto:
    - { nivel: 1, id: abaixo_apetite,   rotulo: "Abaixo do apetite",               condicao: "p90 < apetite" }
    - { nivel: 2, id: entre,            rotulo: "Entre o apetite e a tolerância",  condicao: "apetite <= p90 < tolerancia" }
    - { nivel: 3, id: acima_tolerancia, rotulo: "Acima da tolerância",             condicao: "p90 >= tolerancia" }
  # Revisão M1: a chance é medida nos próximos `horizonte_anos` anos, P = 1 − e^(−horizonte × LEF), o mesmo prazo
  # da vida útil dos controles (custos.yaml, K1). Com a frequência calibrada pelo CSBS (CJ1), a chance em 1 ano
  # fica entre 1% e 5% por cenário e todos cairiam em "rara".
  horizonte_anos: 5
  probabilidade:
    - { nivel: 1, id: rara,     rotulo: "Rara (menos de 1 chance em 10 nos próximos 5 anos)",          maximo: 0.10 }
    - { nivel: 2, id: possivel, rotulo: "Possível (de 1 chance em 10 a 1 em 2 nos próximos 5 anos)",  maximo: 0.50 }
    - { nivel: 3, id: provavel, rotulo: "Provável (mais de 1 chance em 2 nos próximos 5 anos)",        maximo: 1.00 }
  # Cor pela soma dos níveis: 2–3 verde, 4 amarelo, 5–6 vermelho.
  cores:
    - { cor: verde,    soma: [2, 3], significado: "Aceitável, basta acompanhar" }
    - { cor: amarelo,  soma: [4],    significado: "Atenção" }
    - { cor: vermelho, soma: [5, 6], significado: "Agir primeiro" }
  # Rara + acima da tolerância: amarelo pela soma, mas com selo e tratamento por preparação e transferência.
  selo_ruptura:
    quando: { impacto: 3, probabilidade: 1 }
    texto: "Risco de ruptura: é raro, mas se acontecer pode ameaçar a continuidade da empresa. Aqui, mais do que reduzir a chance, vale estar preparado para o impacto: backup isolado e testado, plano de contingência e, se fizer sentido, um seguro cibernético que cubra parte do prejuízo."
    transferencia: "Seguro cibernético: solicite cotação a um corretor de seguros. O custo não entra no cálculo de retorno do investimento, porque o preço depende da análise de cada seguradora."
    # Revisão M2 (c): nos riscos de ruptura, destacar as ações que limitam o impacto mesmo com retorno médio
    # negativo. São as ligadas às funções Responder (RS) e Recuperar (RC) do NIST CSF 2.0, ao backup (PR.DS-11) e
    # à resiliência (PR.IR-03). Prefixo da subcategoria da pergunta.
    preparacao:
      subcategorias: ["RS.", "RC.", "PR.DS-11", "PR.IR-03"]
      fonte: nistcsf2
    texto_preparacao: "Esta ação ajuda a empresa a aguentar o impacto se o problema acontecer. Mesmo que o retorno médio pareça baixo, ela funciona como um seguro contra um prejuízo acima do que a empresa suporta."
