# Setores — TCC1, Tabela 3.2 (formato revisado em S5: cada multiplicador traz valor, fonte e cálculo).
#
# multiplicador_tef[cenario]: frequência relativa da ameaça no setor vs. a média (1,0).
#   RAN: Sophos, The State of Ransomware 2024 (sophos2024), % de organizações atingidas por ransomware no ano, por
#        setor (média 59%). λ = −ln(1 − p); multiplicador = λ(setor) / λ(média).
#   Demais cenários: sem dado por setor => 1,0 (fonte: neutro), conforme o princípio "dados antes de julgamento".
# multiplicador_custo_registro: custo relativo de um vazamento por registro, pelas razões setoriais do
#   ibm2025 (Brasil, média R$ 7,19 mi); setores sem recorte Brasil => 1,0 neutro.
# pendente: true marca valor neutro à espera de dado (listado pelo validador e nas Limitações).

setores:
  - id: varejo
    nome: "Varejo & Comércio"
    exemplos: "E-commerce, lojas de bairro, restaurantes, distribuidores"
    multiplicador_tef:
      RAN: { valor: 0.67, fonte: sophos2024, calculo: "λ(45%) / λ(59%), λ = −ln(1 − p)" }
      VAZ: { valor: 1.0, fonte: neutro }
      FRA: { valor: 1.0, fonte: neutro }
      IND: { valor: 1.0, fonte: neutro }
      TER: { valor: 1.0, fonte: neutro }
      IA: { valor: 1.0, fonte: neutro }
    multiplicador_custo_registro: { valor: 1.0, fonte: neutro }

  - id: servicos
    nome: "Serviços"
    exemplos: "Agências, escritórios de advocacia e contabilidade, consultorias, SaaS"
    multiplicador_tef:
      RAN: { valor: 1.0, fonte: neutro, pendente: true }   # taxa do setor não localizada no relatório
      VAZ: { valor: 1.0, fonte: neutro }
      FRA: { valor: 1.0, fonte: neutro }
      IND: { valor: 1.0, fonte: neutro }
      TER: { valor: 1.0, fonte: neutro }
      IA: { valor: 1.0, fonte: neutro }
    multiplicador_custo_registro: { valor: 1.18, fonte: ibm2025, calculo: "R$ 8,51 mi (serviços) / R$ 7,19 mi (média Brasil)" }

  - id: saude
    nome: "Saúde"
    exemplos: "Clínicas médicas e odontológicas, consultórios, pequenos laboratórios"
    multiplicador_tef:
      RAN: { valor: 1.24, fonte: sophos2024, calculo: "λ(67%) / λ(59%), λ = −ln(1 − p)" }
      VAZ: { valor: 1.0, fonte: neutro }
      FRA: { valor: 1.0, fonte: neutro }
      IND: { valor: 1.0, fonte: neutro }
      TER: { valor: 1.0, fonte: neutro }
      IA: { valor: 1.0, fonte: neutro }
    multiplicador_custo_registro: { valor: 1.59, fonte: ibm2025, calculo: "R$ 11,43 mi (saúde) / R$ 7,19 mi (média Brasil)" }

  - id: industria
    nome: "Indústria Leve"
    exemplos: "Pequenas fábricas, manufatura, alimentos, têxtil, marcenaria"
    multiplicador_tef:
      RAN: { valor: 1.18, fonte: sophos2024, calculo: "λ(65%) / λ(59%), λ = −ln(1 − p)" }
      VAZ: { valor: 1.0, fonte: neutro }
      FRA: { valor: 1.0, fonte: neutro }
      IND: { valor: 1.0, fonte: neutro }
      TER: { valor: 1.0, fonte: neutro }
      IA: { valor: 1.0, fonte: neutro }
    multiplicador_custo_registro: { valor: 1.0, fonte: neutro }

  - id: tecnologia
    nome: "Serviços de Tecnologia"
    exemplos: "Consultorias de TI, software houses, provedores de serviços gerenciados (MSPs)"
    multiplicador_tef:
      RAN: { valor: 0.90, fonte: sophos2024, calculo: "λ(55%) / λ(59%), λ = −ln(1 − p)" }
      VAZ: { valor: 1.0, fonte: neutro }
      FRA: { valor: 1.0, fonte: neutro }
      IND: { valor: 1.0, fonte: neutro }
      TER: { valor: 1.0, fonte: neutro }
      IA: { valor: 1.0, fonte: neutro }
    multiplicador_custo_registro: { valor: 1.0, fonte: neutro }
