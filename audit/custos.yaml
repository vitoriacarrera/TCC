# Verificação de razoabilidade (cis2025cost): custo anual de FERRAMENTAS para o CIS IG1, modelo on-premises.
# Tier 1 (1–10 empregados): US$ 0–38.124; Tier 2 (10–100): US$ 0–176.961; Tier 3 (100–999): US$ 0–1.446.187.
# CIS recomenda que as ferramentas de IG1 fiquem abaixo de 20% do orçamento de TI.
# Mapeamento pelo nº de empregados representativo: portes 1–2 → Tier 1; porte 3 → Tier 2; porte 4 → Tier 3.
referencia_cis_ig1_usd: [38124, 38124, 176961, 1446187]
