# Níveis de porte — TCC1, Tabela 3.1 (base: classificação BNDES / LC 123/2006).
#
# multiplicador_tef: exposição relativa a ameaças (mais pessoas, contas, dispositivos e sistemas
#   expostos => mais eventos de ameaça por ano). Crescimento sublinear. Referência = nível 3.
#   Fonte: julgamento, ancorado em hiscox2025 (59% das PMEs atacadas/ano) — revisar na calibração.
# padroes: valores sugeridos quando o usuário não souber informar (TCC1 §3.6, item 2).

portes:
  - nivel: 1
    nome: "Autônomo / MEI"
    pessoas: [1, 2]
    receita_anual_max: 81000
    multiplicador_tef: 0.30
    padroes:
      faturamento_anual: 60000
      registros_pessoais: 300
    fonte: julgamento

  - nivel: 2
    nome: "Microempresa (ME)"
    pessoas: [3, 19]
    receita_anual_max: 360000
    multiplicador_tef: 0.60
    padroes:
      faturamento_anual: 250000
      registros_pessoais: 2000
    fonte: julgamento

  - nivel: 3
    nome: "Pequena Empresa (EPP)"
    pessoas: [20, 99]
    receita_anual_max: 4800000
    multiplicador_tef: 1.00
    padroes:
      faturamento_anual: 2500000
      registros_pessoais: 10000
    fonte: julgamento

  - nivel: 4
    nome: "Média Empresa"
    pessoas: [100, null]
    receita_anual_max: 300000000
    multiplicador_tef: 1.60
    padroes:
      faturamento_anual: 30000000
      registros_pessoais: 60000
    fonte: julgamento
