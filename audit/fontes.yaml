# Valores de calibração marcados como "julgamento" são estimativas da autora a serem justificadas no texto.

fontes:
  - id: ibm2025
    titulo: "IBM Security — Cost of a Data Breach Report 2025 (recorte Brasil)"
    url: https://brasil.newsroom.ibm.com/2025-07-30-Relatorio-da-IBM-Custo-medio-de-uma-violacao-de-dados-no-Brasil-atinge-R-7,19-milhoes
    dados:
      - "Custo médio de violação no Brasil: R$ 7,19 mi (2024: R$ 6,75 mi)"
      - "Por setor no Brasil: saúde R$ 11,43 mi; financeiro R$ 8,92 mi; serviços R$ 8,51 mi"
      - "Vetores: phishing 18% (R$ 7,18 mi); terceiros/cadeia de suprimentos 15% (R$ 8,98 mi); exploração de vulnerabilidade 13% (R$ 7,61 mi)"
      - "Shadow AI acrescenta em média R$ 591,4 mil ao custo; 87% sem política de governança de IA"
    limitacao: "Amostra de 600 organizações no mundo, majoritariamente de grande porte; valores absolutos não se aplicam a PMEs — usamos apenas as RAZÕES entre setores."

  - id: dbir2025
    titulo: "Verizon — 2025 Data Breach Investigations Report, SMB Snapshot"
    url: https://www.verizon.com/business/resources/infographics/2025-dbir-smb-snapshot.pdf
    dados:
      - "3.049 incidentes em empresas com < 1.000 funcionários; 2.842 com vazamento confirmado"
      - "Ransomware presente em 88% das violações em PMEs (39% em grandes)"
      - "Credenciais roubadas: 33%; engenharia social ~18%, quase só phishing; pretexting mais comum em PMEs"
      - "Envolvimento de terceiros dobrou de 15% para 30% (todas as empresas)"
      - "Resgate mediano US$ 115 mil; 64% não pagaram"

  - id: sophos2025
    titulo: "Sophos — The State of Ransomware 2025"
    url: https://www.sophos.com/en-us/press/press-releases/2025/06/nearly-half-companies-opt-pay-ransom-sophos-report-finds
    dados:
      - "Custo médio de recuperação US$ 1,53 mi; resgate mediano US$ 1 mi (empresas até US$ 250 mi de receita: demanda < US$ 350 mil)"
      - "Causa técnica principal: vulnerabilidade explorada; 40% tinham falha de segurança desconhecida"
      - "53% se recuperaram em até uma semana; 18% levaram mais de um mês; 54% usaram backup"

  - id: hiscox2025
    titulo: "Hiscox Cyber Readiness Report 2025"
    url: https://www.theinsurer.com/cyber-risk/news/hiscox-survey-finds-59-of-smes-have-faced-cyber-attack-in-past-year-2025-09-29/
    dados:
      - "59% das PMEs relataram ao menos um ataque cibernético nos últimos 12 meses"

  - id: ic3_2024
    titulo: "FBI IC3 — Internet Crime Report 2024"
    url: https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf
    dados:
      - "Business Email Compromise (BEC): ~US$ 2,8 bi em perdas reportadas em 2024, segunda maior categoria"

  - id: lgpd
    titulo: "Lei 13.709/2018 (LGPD) e Resolução CD/ANPD nº 4/2023 (dosimetria de sanções)"
    url: https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm
    dados:
      - "Multa simples de até 2% do faturamento, limitada a R$ 50 mi por infração (art. 52, II)"
      - "Dados sensíveis (art. 5º, II e art. 11) — ex.: saúde — agravam a infração"

