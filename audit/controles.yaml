# Controles de segurança — ABNT NBR ISO/IEC 27002:2022 (ADR-003).
# tipo: atributo "tipo de controle" da própria 27002 (preventivo, detectivo, corretivo).
# Custo anual de cada controle por porte: calculado a partir de `custos.yaml` (licenças com preço público +
#   horas × custo da hora de mercado). Ver `riskpme-catalogo custos`.
# esforco: baixo (dias), medio (semanas), alto (meses / depende de fornecedor).
# acao: título do plano de ação para o gestor, em linguagem simples (revisão FE, 26/10); o nome da norma fica
#   para o técnico.

controles:
  - { id: "5.1",  nome: "Políticas de segurança da informação", acao: "Escrever regras simples de uso de senhas, e-mail e computadores",              tipo: preventivo, esforco: baixo }
  - { id: "5.2",  nome: "Papéis e responsabilidades pela segurança da informação", acao: "Definir quem cuida da segurança digital", tipo: preventivo, esforco: baixo }
  - { id: "5.9",  nome: "Inventário de informações e outros ativos associados", acao: "Listar os equipamentos, os sistemas e onde ficam os dados", tipo: preventivo, esforco: medio }
  - { id: "5.10", nome: "Uso aceitável de informações e outros ativos associados", acao: "Combinar como usar as ferramentas e as informações da empresa, inclusive a inteligência artificial", tipo: preventivo, esforco: baixo }
  - { id: "5.14", nome: "Transferência de informações", acao: "Enviar arquivos e informações de forma segura",                      tipo: preventivo, esforco: baixo }
  - { id: "5.15", nome: "Controle de acesso", acao: "Dar a cada pessoa só os acessos de que ela precisa",                                tipo: preventivo, esforco: medio }
  - { id: "5.16", nome: "Gestão de identidade", acao: "Ter um login individual para cada pessoa",                              tipo: preventivo, esforco: baixo }
  - { id: "5.17", nome: "Informações de autenticação", acao: "Usar senhas fortes e um gerenciador de senhas",                       tipo: preventivo, esforco: baixo }
  - { id: "5.18", nome: "Direitos de acesso", acao: "Revisar e retirar os acessos de quem saiu ou mudou de função",                                tipo: preventivo, esforco: baixo }
  - { id: "5.19", nome: "Segurança da informação nas relações com fornecedores", acao: "Escolher e contratar fornecedores com cuidado", tipo: preventivo, esforco: medio }
  - { id: "5.23", nome: "Segurança da informação para uso de serviços em nuvem", acao: "Configurar com segurança os serviços em nuvem", tipo: preventivo, esforco: medio }
  - { id: "5.24", nome: "Planejamento e preparação da gestão de incidentes de segurança da informação", acao: "Ter um plano para quando algo der errado", tipo: corretivo, esforco: medio }
  - { id: "5.30", nome: "Prontidão de TIC para continuidade de negócios", acao: "Preparar a empresa para continuar funcionando se os sistemas pararem",    tipo: corretivo, esforco: alto }
  - { id: "5.31", nome: "Requisitos legais, estatutários, regulamentares e contratuais", acao: "Conhecer as obrigações legais e contratuais de segurança", tipo: preventivo, esforco: medio }
  - { id: "5.34", nome: "Privacidade e proteção de dados pessoais", acao: "Cuidar dos dados pessoais de clientes e funcionários",          tipo: preventivo, esforco: medio }
  - { id: "6.3",  nome: "Conscientização, educação e treinamento em segurança da informação", acao: "Treinar a equipe contra golpes e descuidos", tipo: preventivo, esforco: baixo }
  - { id: "8.1",  nome: "Dispositivos endpoint do usuário", acao: "Proteger computadores, celulares e máquinas de trabalho",                  tipo: preventivo, esforco: medio }
  - { id: "8.2",  nome: "Direitos de acessos privilegiados", acao: "Limitar e proteger as contas de administrador",                 tipo: preventivo, esforco: medio }
  - { id: "8.5",  nome: "Autenticação segura", acao: "Ativar a verificação em duas etapas",                               tipo: preventivo, esforco: baixo }
  - { id: "8.7",  nome: "Proteção contra malware", acao: "Instalar e manter um antivírus",                           tipo: preventivo, esforco: baixo }
  - { id: "8.8",  nome: "Gestão de vulnerabilidades técnicas", acao: "Manter sistemas e programas atualizados",               tipo: preventivo, esforco: medio }
  - { id: "8.9",  nome: "Gestão de configuração", acao: "Padronizar a configuração dos equipamentos",                            tipo: preventivo, esforco: medio }
  - { id: "8.10", nome: "Exclusão de informações", acao: "Apagar com segurança os dados que não são mais necessários",                           tipo: preventivo, esforco: baixo }
  - { id: "8.12", nome: "Prevenção de vazamento de dados", acao: "Evitar que dados sigilosos saiam da empresa",                   tipo: preventivo, esforco: alto }
  - { id: "8.13", nome: "Backup das informações", acao: "Fazer cópias de segurança e testar a recuperação",                            tipo: corretivo, esforco: baixo }
  - { id: "8.14", nome: "Redundância dos recursos de tratamento de informações", acao: "Ter internet e sistemas de reserva", tipo: preventivo, esforco: alto }
  - { id: "8.15", nome: "Registros (logs)", acao: "Guardar registros de quem acessou o quê",                                  tipo: detectivo,  esforco: medio }
  - { id: "8.16", nome: "Atividades de monitoramento", acao: "Acompanhar alertas de atividade suspeita",                       tipo: detectivo,  esforco: alto }
  - { id: "8.20", nome: "Segurança de redes", acao: "Proteger a rede e o Wi-Fi da empresa",                                tipo: preventivo, esforco: medio }
  - { id: "8.22", nome: "Segregação de redes", acao: "Separar a rede de visitantes da rede dos equipamentos importantes",                               tipo: preventivo, esforco: medio }
  - { id: "8.23", nome: "Filtragem da web", acao: "Bloquear sites perigosos",                                  tipo: preventivo, esforco: baixo }
  - { id: "8.28", nome: "Codificação segura", acao: "Desenvolver programas com segurança",                                tipo: preventivo, esforco: medio }
