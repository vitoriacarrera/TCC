[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskpme"
version = "0.1.0"
description = "Motor FAIR + Monte Carlo e API da ferramenta RiscoPME (TCC UFMG)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "fastapi>=0.162",
  "starlette>=1.3.1",   # CVE-2024-47874, CVE-2025-54121, CVE-2026-48710, CVE-2026-48817/48818, CVE-2026-54282/54283
  "h11>=0.16.0",        # CVE-2025-43859 (request smuggling)
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "pip-audit>=2.7", "bandit>=1.7"]

[project.scripts]
riskpme-catalogo = "riskpme.catalog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 110
target-version = "py311"
