name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # mesma versão da imagem de produção (requirements.lock)
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Valida catálogo de auditoria
        run: riskpme-catalogo validar
      - name: Testes
        run: pytest -q
      - name: Vulnerabilidades conhecidas nas dependências (CVE)
        run: pip-audit -r requirements.lock
      - name: Análise estática de segurança
        run: bandit -q -r src

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Vulnerabilidades conhecidas nas dependências
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build (inclui checagem de tipos)
        run: npm run build
